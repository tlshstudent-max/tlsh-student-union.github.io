    <script>
        const spreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ7BWI3HaxcFZFKNmSBirSF1d3fQ1VDFhat9xn6HgteL6eSHSAVqggtq4CMPB5YF5_0sVRl-Ij4eZm/pub?output=csv';

        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = '';
            let quoted = false;

            for (let i = 0; i < text.length; i += 1) {
                const char = text[i];
                const next = text[i + 1];
                if (char === '"' && quoted && next === '"') {
                    field += '"';
                    i += 1;
                } else if (char === '"') {
                    quoted = !quoted;
                } else if (char === ',' && !quoted) {
                    row.push(field);
                    field = '';
                } else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && next === '\n') i += 1;
                    row.push(field);
                    if (row.some(value => value.trim())) rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += char;
                }
            }
            row.push(field);
            if (row.some(value => value.trim())) rows.push(row);
            return rows;
        }

        function safeAnnouncementUrl(value) {
            if (!value || value.trim() === '#') return '#';
            try {
                const url = new URL(value.trim(), window.location.href);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
            } catch {
                return '#';
            }
        }

        function createAnnouncement(cols) {
            const link = document.createElement('a');
            link.className = 'news-card';
            link.href = safeAnnouncementUrl(cols[4]);

            const tag = document.createElement('span');
            tag.className = 'category-tag';
            tag.textContent = `[${(cols[0] || '公告').trim()}] ${(cols[3] || '').trim()}`;

            const title = document.createElement('h3');
            title.textContent = (cols[1] || '未命名公告').trim();

            const summary = document.createElement('p');
            summary.textContent = (cols[2] || '').trim();
            link.append(tag, title, summary);
            return link;
        }

        async function loadAnnouncements() {
            const container = document.getElementById('announcement-grid');
            try {
                const response = await fetch(spreadsheetUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.text();
                const rows = parseCsv(data).slice(1).filter(cols => cols.length >= 2 && cols[1].trim());
                container.replaceChildren(...rows.map(createAnnouncement));
                if (!rows.length) {
                    const empty = document.createElement('p');
                    empty.className = 'status-text';
                    empty.textContent = '目前沒有最新公告。';
                    container.append(empty);
                }
            } catch (error) {
                console.error('公告讀取失敗：', error);
                const status = document.createElement('p');
                status.className = 'status-text error-text';
                status.textContent = '公告暫時無法載入，請稍後再試。';
                container.replaceChildren(status);
            } finally {
                container.setAttribute('aria-busy', 'false');
            }
        }
        loadAnnouncements();
    </script>
    <script src="main.js"></script>
