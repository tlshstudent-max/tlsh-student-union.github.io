            <h1>公關組</h1>
            <p class="motto">對外連結，爭取權益，建立斗中品牌價值</p>
        </div>
    </header>

    <main id="main-content" class="container">
        <section class="department-feed" data-department-feed="pr" aria-labelledby="department-feed-title">
            <h2 id="department-feed-title" class="section-title">公關組公告與文件</h2>
            <p class="department-status" role="status" aria-live="polite">正在讀取公開內容…</p>
            <div class="department-list news-grid" aria-busy="true"></div>
        </section>
        <section class="zen-section">
            <h2 class="section-title">核心業務</h2>
            <div class="grid">
                <div class="card">
                    <h3>特約商店洽談</h3>
                    <p>開發校園周邊特約商家，為全體同學爭取實質的消費優惠。</p>
                </div>
                <div class="card">
                    <h3>校際交流</h3>
                    <p>聯繫他校學生會，辦理跨校論壇與觀摩，拓展斗中影響力。</p>
                </div>
                <div class="card">
                    <h3>贊助接洽</h3>
                    <p>與企業及校友聯繫，為校內大型活動籌措穩定資源。</p>
                </div>
            </div>
        </section>

        <section class="info-section">
            <h2 class="section-title">對外聯繫</h2>
            <div class="contact-box">
                <p>若有合作意向或公關需求，請洽公關部長信箱或透過本站留言。我們重視每一次的對外合作機會。</p>
                <div class="email-tag">Email: <a href="mailto:tlsh.student@gmail.com">tlsh.student@gmail.com</a></div>
            </div>
        </section>
