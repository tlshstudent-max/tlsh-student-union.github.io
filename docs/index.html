<body class="docs-page">
    <a class="skip-link" href="#main-content">跳至主要內容</a>
    <div id="cursor-glow" aria-hidden="true"></div>
    
    <header class="page-header">
        <a href="../index.html" class="back-link">← 返回石澗大廳</a>
        <div class="header-content">
            <h1>公開文件</h1>
            <p class="motto">查找會議紀錄、自治法規與行政文件。</p>
        </div>
    </header>

    <main id="main-content" class="container">
        <section class="department-feed" data-department-feed="docs" data-kind="announcement" data-hide-empty aria-labelledby="department-feed-title">
            <h2 id="department-feed-title" class="section-title">文書組公告</h2>
            <p class="department-status" role="status" aria-live="polite">正在讀取公開內容…</p>
            <div class="department-list news-grid" aria-busy="true"></div>
        </section>
        <section class="zen-section document-about">
            <details>
            <summary>文書組工作介紹</summary>
            <div class="grid">
                <div class="card">
                    <h3>會議紀錄</h3>
                    <p>負責校內重要會議的筆記與整理，確保決策過程公開透明。</p>
                </div>
                <div class="card">
                    <h3>檔案管理</h3>
                    <p>統籌學生會各組文件、公文及雲端硬碟的架構規劃與備份。</p>
                </div>
                <div class="card">
                    <h3>法規彙編</h3>
                    <p>管理學生會組織章程與各項施行細則，提供同學隨時查閱。</p>
                </div>
            </div>
            </details>
        </section>

        <section class="archive-section">
            <div class="archive-heading">
                <div>
                    <h2 class="section-title">公開文件庫</h2>
                    <p class="archive-intro">從會議紀錄到自治法規，讓每一份正式文件都能被查找、閱讀與追溯。</p>
                </div>
                <span id="document-count" class="document-count" aria-live="polite"></span>
            </div>

            <div id="archive-controls" class="archive-controls" aria-label="文件篩選工具" hidden>
                <div class="control-group search-group">
                    <label for="document-search">搜尋文件</label>
                    <input id="document-search" type="search" placeholder="輸入名稱、說明或類別" autocomplete="off">
                </div>
                <details id="document-filters" class="document-filters">
                    <summary>篩選與排序 <span id="active-filter-count"></span></summary>
                    <div class="archive-filter-grid">
                        <div class="control-group">
                            <label for="category-filter">文件類別</label>
                            <select id="category-filter">
                                <option value="">全部類別</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="year-filter">學年度</label>
                            <select id="year-filter">
                                <option value="">全部年度</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="sort-order">排列方式</label>
                            <select id="sort-order">
                                <option value="newest">日期：新到舊</option>
                                <option value="oldest">日期：舊到新</option>
                            </select>
                        </div>
                    </div>
                    <button id="reset-document-filters" class="button button-secondary" type="button">清除搜尋與篩選</button>
                </details>
            </div>

            <div id="archive-status" class="archive-status" role="status" aria-live="polite">
                正在從石澗檔案庫讀取公開文件…
            </div>
            <div id="archive-list" class="archive-list" aria-busy="true"></div>
        </section>
    </main>

</html>
